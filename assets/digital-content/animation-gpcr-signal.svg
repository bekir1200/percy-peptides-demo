<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">How a GPCR signalling study works</title>
  <desc id="desc">A step-by-step educational animation: a peptide ligand binds a GPCR, an intracellular signal is examined, then researchers measure a response under defined conditions.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fbfaf7"/><stop offset="1" stop-color="#f1efe8"/></linearGradient>
    <linearGradient id="membrane" x2="0" y2="1"><stop stop-color="#e5eadf"/><stop offset=".5" stop-color="#cbd6c6"/><stop offset="1" stop-color="#e5eadf"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#657966"/></marker>
  </defs>
  <style>
    text{font-family:'DM Sans',Arial,sans-serif;fill:#202722}.display{font-family:Manrope,Arial,sans-serif;font-weight:700;letter-spacing:-2px}.step{font-size:18px;font-weight:700;letter-spacing:1.8px;fill:#657966}.label{font-size:24px;font-weight:700}.small{font-size:19px;fill:#53605a}
    .travelling-ligand{transform-box:fill-box;transform-origin:top left;animation:bind 10s ease-in-out infinite}.binding-halo{opacity:0;animation:binding 10s ease-in-out infinite}
    .signal-one,.signal-two,.signal-three{opacity:.15}.signal-one{animation:signal-one 10s ease-in-out infinite}.signal-two{animation:signal-two 10s ease-in-out infinite}.signal-three{animation:signal-three 10s ease-in-out infinite}
    .flow-one,.flow-two{stroke-dasharray:100;stroke-dashoffset:100}.flow-one{animation:flow-one 10s ease-in-out infinite}.flow-two{animation:flow-two 10s ease-in-out infinite}.curve{stroke-dasharray:880;stroke-dashoffset:880;animation:measure 10s ease-in-out infinite}
    @keyframes bind{0%,8%{transform:translateX(0)}32%,72%{transform:translateX(335px)}85%,100%{transform:translateX(0)}}
    @keyframes binding{0%,28%,74%,100%{opacity:0}38%,65%{opacity:.75}}
    @keyframes signal-one{0%,37%,100%{opacity:.12}44%,88%{opacity:1}}
    @keyframes signal-two{0%,48%,100%{opacity:.12}55%,88%{opacity:1}}
    @keyframes signal-three{0%,59%,100%{opacity:.12}66%,88%{opacity:1}}
    @keyframes flow-one{0%,40%,100%{stroke-dashoffset:100;opacity:.25}50%,88%{stroke-dashoffset:0;opacity:1}}
    @keyframes flow-two{0%,60%,100%{stroke-dashoffset:100;opacity:.25}70%,88%{stroke-dashoffset:0;opacity:1}}
    @keyframes measure{0%,72%,100%{stroke-dashoffset:880;opacity:.25}87%,96%{stroke-dashoffset:0;opacity:1}}
    @media(prefers-reduced-motion:reduce){.travelling-ligand,.binding-halo,.signal-one,.signal-two,.signal-three,.flow-one,.flow-two,.curve{animation:none!important}.signal-one,.signal-two,.signal-three{opacity:1}.flow-one,.flow-two,.curve{stroke-dashoffset:0;opacity:1}.binding-halo{opacity:.35}}
  </style>
  <rect width="1080" height="1350" fill="url(#paper)"/>
  <text x="76" y="86" class="step">PERCY PEPTIDES · RESEARCH IN CONTEXT</text>
  <text x="76" y="170" class="display" font-size="57">How a GPCR signalling</text>
  <text x="76" y="237" class="display" font-size="57">study works</text>
  <text x="78" y="286" class="small">Follow the question from binding to measurement.</text>

  <circle cx="98" cy="360" r="20" fill="#34493d"/><text x="98" y="368" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">1</text>
  <text x="134" y="368" class="label">Ligand binding</text>
  <text x="134" y="402" class="small">A peptide interacts with a receptor.</text>
  <text x="84" y="488" class="step">PEPTIDE LIGAND</text>
  <g class="travelling-ligand">
    <circle cx="145" cy="530" r="24" fill="#b66f52"/><circle cx="191" cy="518" r="22" fill="#d99877"/><circle cx="237" cy="534" r="23" fill="#b66f52"/><circle cx="282" cy="521" r="21" fill="#d99877"/>
    <path d="m165 526 5-2m43 2 7 3m43-3 5-2" stroke="#8c573f" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle class="binding-halo" cx="573" cy="529" r="72" fill="#d6df9f"/>
  <rect x="64" y="602" width="950" height="73" rx="36" fill="url(#membrane)"/>
  <path d="M77 619H1001M77 658H1001" stroke="#aab9a8" stroke-width="4" stroke-dasharray="4 17"/>
  <g transform="translate(573 632)">
    <path d="M-47-111c-31 17-17 43-11 62 5 18-10 33-2 51 8 22 40 27 50 6 9-18 1-33 10-48 12-20 39-31 30-57-7-20-25-30-38-22-10 7-10 21-19 23-11 2-14-17-20-21Z" fill="#657966" stroke="#34493d" stroke-width="8"/>
    <path d="M-42-94c-17 14-8 31-3 46m49-33c13-9 26 0 28 10m-50 32c-13 9-7 22-2 31m33-12c10-13 20-11 29-2" fill="none" stroke="#d6df9f" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="573" y="713" text-anchor="middle" class="step">GPCR</text>
  <text x="764" y="536" class="small">Cell exterior</text>
  <text x="764" y="738" class="small">Inside the cell</text>

  <path d="M80 788H1000" stroke="#d9dcd4" stroke-width="2"/>
  <circle cx="98" cy="839" r="20" fill="#34493d"/><text x="98" y="847" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">2</text>
  <text x="134" y="847" class="label">Intracellular signalling</text>
  <text x="134" y="880" class="small">Researchers examine signals inside the cell.</text>
  <g>
    <path class="flow-one" d="M349 965H478" fill="none" stroke="#657966" stroke-width="5" marker-end="url(#arrow)"/>
    <path class="flow-two" d="M600 965H729" fill="none" stroke="#657966" stroke-width="5" marker-end="url(#arrow)"/>
    <g class="signal-one"><circle cx="300" cy="965" r="38" fill="#e6ecdf"/><circle cx="300" cy="965" r="17" fill="#657966"/><text x="300" y="1032" text-anchor="middle" class="small">Signal 1</text></g>
    <g class="signal-two"><circle cx="550" cy="965" r="38" fill="#e6ecdf"/><circle cx="550" cy="965" r="17" fill="#b66f52"/><text x="550" y="1032" text-anchor="middle" class="small">Signal 2</text></g>
    <g class="signal-three"><circle cx="800" cy="965" r="38" fill="#e6ecdf"/><circle cx="800" cy="965" r="17" fill="#95a658"/><text x="800" y="1032" text-anchor="middle" class="small">Signal 3</text></g>
  </g>

  <rect x="78" y="1071" width="924" height="177" rx="18" fill="#fff" stroke="#d9dcd4" stroke-width="2"/>
  <circle cx="110" cy="1117" r="20" fill="#34493d"/><text x="110" y="1125" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">3</text>
  <text x="146" y="1125" class="label">Measured response</text>
  <path d="M130 1200V1158M130 1200H931" fill="none" stroke="#a7b1a5" stroke-width="3"/>
  <path class="curve" d="M162 1192C255 1190 284 1184 356 1181s100-11 154-25 86-42 151-45 112-1 217-2" fill="none" stroke="#657966" stroke-width="7" stroke-linecap="round"/>
  <text x="78" y="1301" class="small" font-size="18">The result depends on the receptor, cell type, assay, and conditions.</text>
</svg>
